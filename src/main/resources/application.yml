
server:
  port: 8081
spring:
  application:
    name: SpringOauth

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: pa

  jpa:
    hibernate:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      client:
        registration:
          google:
            client-id:
            client-secret:
            scope:
              - openid
              - email
              - profile
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG